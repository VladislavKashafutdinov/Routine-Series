basePath: /api/v1
definitions:
  internal_activity.ActivityWithDef:
    properties:
      archived:
        type: boolean
      created_at:
        type: string
      definition:
        $ref: '#/definitions/routine-series_backend_internal_seriesdefinition.SeriesDefinition'
      id:
        type: integer
      name:
        type: string
    type: object
  internal_activity.CreateActivityRequest:
    properties:
      currency:
        type: string
      name:
        type: string
      reward:
        type: number
      series_length:
        type: integer
    type: object
  internal_activity.UpdateActivityRequest:
    properties:
      name:
        type: string
    type: object
  internal_completion.Completion:
    properties:
      activity_id:
        type: integer
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
      id:
        type: integer
    type: object
  internal_completion.ToggleRequest:
    properties:
      activity_id:
        example: 1
        type: integer
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
    type: object
  internal_completion.ToggleResponse:
    properties:
      completion:
        $ref: '#/definitions/internal_completion.Completion'
      created:
        type: boolean
    type: object
  internal_dataimport.Stats:
    properties:
      activities:
        type: integer
      completions:
        type: integer
      reward_issues:
        type: integer
      series_definitions:
        type: integer
    type: object
  internal_reward.CreateRequest:
    properties:
      activity_id:
        example: 1
        type: integer
      amount:
        example: 100
        type: number
      currency:
        example: ₽
        type: string
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
    type: object
  internal_reward.PaginatedResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_reward.RewardIssue'
        type: array
      total:
        type: integer
    type: object
  internal_reward.RewardIssue:
    properties:
      activity_id:
        type: integer
      amount:
        type: number
      currency:
        type: string
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
      id:
        type: integer
    type: object
  internal_reward.UpdateRequest:
    properties:
      amount:
        example: 150
        type: number
      currency:
        example: ₽
        type: string
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
    type: object
  internal_seriesdefinition.CreateRequest:
    properties:
      currency:
        type: string
      reward:
        type: number
      series_length:
        type: integer
    type: object
  internal_seriesdefinition.SeriesDefinition:
    properties:
      activity_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      reward:
        type: number
      series_length:
        type: integer
    type: object
  routine-series_backend_internal_api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  routine-series_backend_internal_seriesdefinition.SeriesDefinition:
    properties:
      activity_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      reward:
        type: number
      series_length:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for tracking daily activities, completions, and rewards.
  title: Routine Series API
  version: 0.1.0
paths:
  /activities:
    get:
      description: Returns all non-archived activities with their latest series definition.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_activity.ActivityWithDef'
            type: array
      summary: List active activities
      tags:
      - activities
    post:
      consumes:
      - application/json
      description: Creates an activity together with its first series definition in
        a single transaction.
      parameters:
      - description: Activity data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_activity.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Create activity
      tags:
      - activities
  /activities/{id}:
    get:
      description: Returns a single activity with its latest series definition.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Get activity by ID
      tags:
      - activities
    patch:
      consumes:
      - application/json
      description: Updates the name of an activity by ID.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_activity.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Rename activity
      tags:
      - activities
  /activities/{id}/archive:
    post:
      description: Moves an activity to the archive (soft-delete).
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Archive activity
      tags:
      - activities
  /activities/{id}/restore:
    post:
      description: Restores an activity from the archive.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Restore activity
      tags:
      - activities
  /activities/{id}/series-definitions:
    get:
      description: Returns all series definition versions for an activity, newest
        first.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_seriesdefinition.SeriesDefinition'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: List series definitions
      tags:
      - series-definitions
    post:
      consumes:
      - application/json
      description: Adds a new series definition version for an activity.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Series parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_seriesdefinition.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_seriesdefinition.SeriesDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Create series definition
      tags:
      - series-definitions
  /activities/{id}/series-definitions/{defId}:
    delete:
      description: Deletes a series definition version. Cannot delete the last remaining
        definition.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Series Definition ID
        in: path
        name: defId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Delete series definition
      tags:
      - series-definitions
  /activities/archived:
    get:
      description: Returns all archived activities with their latest series definition.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_activity.ActivityWithDef'
            type: array
      summary: List archived activities
      tags:
      - activities
  /completions:
    get:
      description: Returns completions for an activity within a date range.
      parameters:
      - description: Activity ID
        in: query
        name: activity_id
        required: true
        type: integer
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_completion.Completion'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: List completions
      tags:
      - completions
  /completions/toggle:
    post:
      consumes:
      - application/json
      description: Creates a completion mark for the given date if none exists; deletes
        it if one already exists.
      parameters:
      - description: Completion data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_completion.ToggleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_completion.ToggleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Toggle completion
      tags:
      - completions
  /health:
    get:
      description: Returns ok if the server and database are reachable.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /import:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a JSON file and imports its data (activities, seriesDefinitions,
        completions, rewardIssues). Truncates existing data first.
      parameters:
      - description: JSON data dump
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dataimport.Stats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Import data
      tags:
      - import
  /reward-issues:
    get:
      description: Returns paginated reward issues for an activity, newest first.
      parameters:
      - description: Activity ID
        in: query
        name: activity_id
        required: true
        type: integer
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reward.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: List reward issues
      tags:
      - rewards
    post:
      consumes:
      - application/json
      description: Records a reward issuance for an activity.
      parameters:
      - description: Reward data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reward.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_reward.RewardIssue'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Create reward issue
      tags:
      - rewards
  /reward-issues/{id}:
    delete:
      description: Deletes a reward issue by ID.
      parameters:
      - description: Reward Issue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Delete reward issue
      tags:
      - rewards
    patch:
      consumes:
      - application/json
      description: Updates fields of a reward issue by ID. All fields are optional;
        at least one must be provided.
      parameters:
      - description: Reward Issue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reward.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reward.RewardIssue'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routine-series_backend_internal_api.ErrorResponse'
      summary: Update reward issue
      tags:
      - rewards
swagger: "2.0"
