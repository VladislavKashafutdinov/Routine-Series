basePath: /api/v1
definitions:
  activity.ActivityWithDef:
    properties:
      archived:
        type: boolean
      created_at:
        type: string
      definition:
        $ref: '#/definitions/seriesdefinition.SeriesDefinition'
      id:
        type: integer
      name:
        type: string
    type: object
  activity.CreateActivityRequest:
    properties:
      currency:
        type: string
      name:
        type: string
      reward:
        type: number
      series_length:
        type: integer
    type: object
  activity.UpdateActivityRequest:
    properties:
      name:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  completion.Completion:
    properties:
      activity_id:
        type: integer
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
      id:
        type: integer
    type: object
  completion.ToggleRequest:
    properties:
      activity_id:
        example: 1
        type: integer
      date:
        description: YYYY-MM-DD
        example: "2026-08-12"
        type: string
    type: object
  completion.ToggleResponse:
    properties:
      completion:
        $ref: '#/definitions/completion.Completion'
      created:
        type: boolean
    type: object
  dataimport.Stats:
    properties:
      activities:
        type: integer
      completions:
        type: integer
      reward_issues:
        type: integer
      series_definitions:
        type: integer
    type: object
  seriesdefinition.CreateRequest:
    properties:
      currency:
        type: string
      reward:
        type: number
      series_length:
        type: integer
    type: object
  seriesdefinition.SeriesDefinition:
    properties:
      activity_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      reward:
        type: number
      series_length:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for tracking daily activities, completions, and rewards.
  title: Routine Series API
  version: 0.1.0
paths:
  /activities:
    get:
      description: Returns all non-archived activities with their latest series definition.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/activity.ActivityWithDef'
            type: array
      summary: List active activities
      tags:
      - activities
    post:
      consumes:
      - application/json
      description: Creates an activity together with its first series definition in
        a single transaction.
      parameters:
      - description: Activity data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/activity.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create activity
      tags:
      - activities
  /activities/{id}:
    get:
      description: Returns a single activity with its latest series definition.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get activity by ID
      tags:
      - activities
    patch:
      consumes:
      - application/json
      description: Updates the name of an activity by ID.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/activity.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/activity.ActivityWithDef'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Rename activity
      tags:
      - activities
  /activities/{id}/archive:
    post:
      description: Moves an activity to the archive (soft-delete).
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Archive activity
      tags:
      - activities
  /activities/{id}/restore:
    post:
      description: Restores an activity from the archive.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Restore activity
      tags:
      - activities
  /activities/{id}/series-definitions:
    get:
      description: Returns all series definition versions for an activity, newest
        first.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/seriesdefinition.SeriesDefinition'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List series definitions
      tags:
      - series-definitions
    post:
      consumes:
      - application/json
      description: Adds a new series definition version for an activity.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Series parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/seriesdefinition.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/seriesdefinition.SeriesDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create series definition
      tags:
      - series-definitions
  /activities/{id}/series-definitions/{defId}:
    delete:
      description: Deletes a series definition version. Cannot delete the last remaining
        definition.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Series Definition ID
        in: path
        name: defId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete series definition
      tags:
      - series-definitions
  /activities/archived:
    get:
      description: Returns all archived activities with their latest series definition.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/activity.ActivityWithDef'
            type: array
      summary: List archived activities
      tags:
      - activities
  /completions/toggle:
    post:
      consumes:
      - application/json
      description: Creates a completion mark for the given date if none exists; deletes
        it if one already exists.
      parameters:
      - description: Completion data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/completion.ToggleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/completion.ToggleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Toggle completion
      tags:
      - completions
  /health:
    get:
      description: Returns ok if the server and database are reachable.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /import:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a JSON file and imports its data (activities, seriesDefinitions,
        completions, rewardIssues). Truncates existing data first.
      parameters:
      - description: JSON data dump
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dataimport.Stats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Import data
      tags:
      - import
swagger: "2.0"
