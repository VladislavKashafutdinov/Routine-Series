services:
  - type: web
    name: routine-series-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://vladislavkashafutdinov.github.io"
    plan: free
